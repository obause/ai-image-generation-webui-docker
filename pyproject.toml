[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runpod-workspace"
version = "0.1.7"
description = "Ephemeral RunPod workspace backed by Backblaze B2"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7", "typer>=0.12,<1"]

[project.scripts]
rp = "runpod_workspace.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.13", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_workspace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Typer command declarations use Option() as defaults.

[tool.mypy]
python_version = "3.12"
strict = true
