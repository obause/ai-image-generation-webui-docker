runpod:
  # Optional: omit when creating directly from the wrapper image.
  # template_id: "<RUNPOD_TEMPLATE_ID>"
  # Publish this tag from the GitHub release workflow before creating a Pod.
  wrapper_image: "ghcr.io/obause/ai-image-generation-webui-docker:0.1.2"
  pod_name: "personal-gpu-workspace"
  gpu:
    id: "NVIDIA GeForce RTX 5090"  # validate availability with rp doctor
    count: 1
    min_cuda_version: "12.8"
  cloud: SECURE  # selected RTX 5090 cloud; check live availability with rp doctor
  disk_gb: 500  # models + images + outputs + image; adjust to actual collection
  ports: ["7801/http", "8188/http", "9090/http", "8443/http", "8081/http", "22/tcp"]
  data_center_ids: []
  terminate_after: "8h"  # Pod-side best-effort deadline after successful backup
  wait_timeout_seconds: 7200
  secret_prefix: "rp_workspace"
storage:
  bucket: "<B2_BUCKET>"
  prefix: ""  # dedicated bucket; mappings start at its root
  transfers: 16
  fast_list: true
  restore:
    - name: models
      remote: models
      local: /workspace/models
      required: true
      mode: copy
    - name: swarmui-data
      remote: swarmui-data
      local: /workspace/swarmui-data
      required: false  # first run may not have saved settings yet
    - name: output
      remote: output
      local: /workspace/output
      required: false
    - name: images
      remote: images
      local: /workspace/images
      required: false
    - name: projects
      remote: projects
      local: /workspace/projects
      required: false
    - name: uploads
      remote: uploads
      local: /workspace/uploads
      required: false
    - name: invokeai
      remote: invokeai
      local: /workspace/invokeai
      required: false
    - name: comfy-user
      remote: comfy-user
      local: /workspace/comfy-user
      required: false
    - name: code-server
      remote: code-server
      local: /workspace/code-server
      required: false
  backup:
    - name: models
      local: /workspace/models
      remote: models
      interval_seconds: 300
      mode: copy
    - name: output
      local: /workspace/output
      remote: output
      interval_seconds: 300
      mode: copy
    - name: images
      local: /workspace/images
      remote: images
      interval_seconds: 300
      mode: copy
    - name: projects
      local: /workspace/projects
      remote: projects
      interval_seconds: 300
      mode: copy
    - name: uploads
      local: /workspace/uploads
      remote: uploads
      interval_seconds: 300
      mode: copy
    - name: swarmui-data
      local: /workspace/swarmui-data
      remote: swarmui-data
      interval_seconds: 300
      mode: copy
    - name: invokeai
      local: /workspace/invokeai
      remote: invokeai
      interval_seconds: 300
      mode: copy
    - name: comfy-user
      local: /workspace/comfy-user
      remote: comfy-user
      interval_seconds: 300
      mode: copy
    - name: code-server
      local: /workspace/code-server
      remote: code-server
      interval_seconds: 300
      mode: copy
application:
  original_command: ["invokeai-web"]
  swarmui: true
  code_server: true
  filebrowser: true
  shared_models_path: /workspace/models
